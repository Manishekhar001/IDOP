name: IDOP Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# =========================================================================
# CI PIPELINE OVERVIEW
# =========================================================================
# This workflow runs on every push/PR to main and performs:
#   Job 1 (lint-and-test): Code quality audit + offline unit tests
#   Job 2 (verify-docker-syntax): Docker image build verification (no push)
#
# ⚠️ This workflow does NOT require any GitHub Secrets.
#    All tests run in offline/mock mode with ENV_STATE=testing.
#    Secrets are only needed by the CD pipeline (cd.yml).
# =========================================================================

jobs:
  # =========================================================================
  # JOB 1: CODE QUALITY AUDIT AND OFFLINE TESTING
  # =========================================================================
  lint-and-test:
    name: "Job 1: Lint & Pytest Suite"
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # STEP 1: DISK SPACE OPTIMIZATION
      # ─────────────────────────────────────────────────────────────────────
      - name: "Step 1/7: Free up disk space"
        run: |
          echo "=========================================="
          echo "🧹 DISK SPACE OPTIMIZATION"
          echo "=========================================="
          echo ""
          echo "📊 Disk space BEFORE cleanup:"
          df -h /
          echo ""

          # Remove heavy pre-installed development frameworks
          echo "🗑️ Removing heavy pre-installed software..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          # Clean Docker structures
          echo "🐳 Pruning Docker system..."
          docker system prune -af --volumes || true

          # Clean package managers
          echo "📦 Flushing package caches..."
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo ""
          echo "📊 Disk space AFTER cleanup:"
          df -h /
          echo "✅ Runner workspace optimized!"
          echo ""

      # ─────────────────────────────────────────────────────────────────────
      # STEP 2: CHECKOUT SOURCE CODE
      # ─────────────────────────────────────────────────────────────────────
      - name: "Step 2/7: Checkout code"
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────
      # STEP 3: PRINT CI METADATA & CONFIGURATION
      # ─────────────────────────────────────────────────────────────────────
      - name: "Step 3/7: Print CI metadata"
        run: |
          echo "=========================================="
          echo "🚀 IDOP CI PIPELINE — BUILD INITIATED"
          echo "=========================================="
          echo ""
          echo "📋 Git & Trigger Info:"
          echo "  Commit SHA   : ${{ github.sha }}"
          echo "  Short SHA    : $(echo '${{ github.sha }}' | cut -c1-7)"
          echo "  Triggered By : ${{ github.actor }}"
          echo "  Repository   : ${{ github.repository }}"
          echo "  Workflow     : ${{ github.workflow }}"
          echo "  Run Number   : ${{ github.run_number }}"
          echo "  Event        : ${{ github.event_name }}"
          echo "=========================================="
          echo ""

      # ─────────────────────────────────────────────────────────────────────
      # STEP 4: SETUP PYTHON RUNTIME + INSTALL DEPENDENCIES
      # ─────────────────────────────────────────────────────────────────────
      - name: "Step 4/7: Install uv and Python 3.12"
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true

      - name: "Step 4b/7: Install system libraries"
        run: |
          echo "Installing system dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmagic1

      - name: "Step 4c/7: Sync locked dependencies"
        run: uv sync --locked --extra dev

      # ─────────────────────────────────────────────────────────────────────
      # STEP 5: CODE QUALITY CHECKS (RUFF + BLACK)
      # ─────────────────────────────────────────────────────────────────────
      - name: "Step 5/7: Lint with Ruff"
        run: |
          echo "🔍 Running Ruff code quality audit..."
          uv run ruff check app/ tests/ scripts/
          echo "✅ Ruff audit complete."
          echo ""

      - name: "Step 5b/7: Format check with Black"
        run: |
          echo "🔍 Checking code formatting with Black..."
          uv run black --check app/ tests/ scripts/
          echo "✅ Black format check complete."
          echo ""

      # ─────────────────────────────────────────────────────────────────────
      # STEP 6: RUN PYTEST TEST SUITE (OFFLINE / MOCKED)
      # ─────────────────────────────────────────────────────────────────────
      - name: "Step 6/7: Run Pytest test suite"
        env:
          ENV_STATE: testing
        run: |
          echo "=========================================="
          echo "🧪 RUNNING OFFLINE UNIT TEST SUITE"
          echo "=========================================="
          echo "   ENV_STATE: testing (all API calls mocked)"
          echo ""
          uv run pytest tests/ -v --tb=short --junitxml=junit.xml --cov=app --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml
          echo ""
          echo "✅ All tests passed!"
          echo ""

      - name: "Step 6b/7: Publish test metrics to GitHub"
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## IDOP quality metrics", ""]

          if Path("junit.xml").exists():
              root = ET.parse("junit.xml").getroot()
              cases = root.findall(".//testcase")
              failures = root.findall(".//failure")
              errors = root.findall(".//error")
              skipped = root.findall(".//skipped")
              passed = len(cases) - len(failures) - len(errors) - len(skipped)
              lines.extend([
                  "| Test suite | Result |",
                  "| --- | ---: |",
                  f"| Passed | {passed} |",
                  f"| Failed or errored | {len(failures) + len(errors)} |",
                  f"| Skipped | {len(skipped)} |",
                  f"| Total | {len(cases)} |",
                  "",
              ])
          else:
              lines.extend(["Test results were not produced.", ""])

          if Path("coverage.xml").exists():
              coverage = ET.parse("coverage.xml").getroot()
              covered = int(coverage.attrib["lines-covered"])
              valid = int(coverage.attrib["lines-valid"])
              percent = 100 * covered / valid if valid else 0
              lines.extend([
                  "| Application line coverage | Value |",
                  "| --- | ---: |",
                  f"| Covered lines | {covered} / {valid} |",
                  f"| Coverage | {percent:.1f}% |",
                  "",
                  "Coverage is reported as a baseline; no threshold is enforced yet.",
                  "",
              ])
          else:
              lines.extend(["Coverage report was not produced.", ""])

          summary.open("a", encoding="utf-8").write("\n".join(lines))
          PY

      - name: "Step 6c/7: Archive test and coverage reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idop-quality-reports-${{ github.run_number }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

      # ─────────────────────────────────────────────────────────────────────
      # STEP 7: CI COMPLETION SUMMARY
      # ─────────────────────────────────────────────────────────────────────
      - name: "Step 7/7: CI summary"
        run: |
          echo "=========================================="
          echo "✅ CI PIPELINE COMPLETED SUCCESSFULLY"
          echo "=========================================="
          echo ""
          echo "📋 Results:"
          echo "  ✅ Ruff lint check    : Passed"
          echo "  ✅ Black format check : Passed"
          echo "  ✅ Pytest suite       : Passed"
          echo ""
          echo "Next: CD pipeline will build and deploy if this is a push to main."
          echo "=========================================="

  # =========================================================================
  # JOB 2: DOCKER IMAGE BUILD VERIFICATION (ZERO-RISK, NO PUSH)
  # =========================================================================
  verify-docker-build:
    name: "Job 2: Docker Build Verification"
    needs: [lint-and-test]
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # STEP 1: DISK SPACE OPTIMIZATION
      # ─────────────────────────────────────────────────────────────────────
      - name: "Step 1/5: Free up disk space"
        run: |
          echo "🧹 Optimizing disk space for Docker build..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          echo "✅ Disk space optimized!"
          echo ""

      # ─────────────────────────────────────────────────────────────────────
      # STEP 2: CHECKOUT SOURCE CODE
      # ─────────────────────────────────────────────────────────────────────
      - name: "Step 2/5: Checkout code"
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────
      # STEP 3: VERIFY DOCKER INSTALLATION
      # ─────────────────────────────────────────────────────────────────────
      - name: "Step 3/5: Verify Docker installation"
        run: |
          echo "⚙️ Docker environment:"
          docker version
          echo ""
          echo "✅ Docker daemon ready!"
          echo ""

      # ─────────────────────────────────────────────────────────────────────
      # STEP 4: SETUP BUILDX + QEMU
      # ─────────────────────────────────────────────────────────────────────
      - name: "Step 4a/5: Set up QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "Step 4b/5: Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      # ─────────────────────────────────────────────────────────────────────
      # STEP 5: BUILD DOCKER IMAGE (LOCAL ONLY, NO PUSH)
      # ─────────────────────────────────────────────────────────────────────
      - name: "Step 5/5: Build Docker image (linux/amd64)"
        run: |
          echo "=========================================="
          echo "🔨 BUILDING DOCKER IMAGE (VERIFICATION ONLY)"
          echo "=========================================="
          echo "   Platform: linux/amd64"
          echo "   Dockerfile: ./Dockerfile"
          echo "   ⚠️ This is a build-only check. Image is NOT pushed."
          echo ""
          docker build --platform linux/amd64 -f Dockerfile -t idop-app:ci-check .
          echo ""
          echo "✅ Docker image compiled successfully with 0 errors!"
          echo ""
          echo "📋 Image details:"
          docker images idop-app:ci-check
          echo "=========================================="
